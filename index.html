<form 
  action="https://api.web3forms.com/submit"
  method="POST"
  enctype="multipart/form-data"
>

  <!-- Chave da conta -->
  <input 
    type="hidden" 
    name="access_key" 
    value="SUA_ACCESS_KEY"
  >

  <!-- Página de confirmação -->
  <input 
    type="hidden" 
    name="redirect" 
    value="https://rihappytangara.github.io/pokemon/confirmacao.html"
  >

  <input type="text" name="nome" required>

  <textarea name="decklist"></textarea>

  <input 
    type="file" 
    name="imagem"
    accept="image/*"
  >

  <button type="submit">
    Enviar
  </button>

</form>
